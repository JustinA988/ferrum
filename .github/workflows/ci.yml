# Continuous integration for the ferrum workspace.
#
# On every push and pull request: rustfmt --check, clippy with warnings denied,
# and `cargo test --workspace` on stable. Acceptance tests marked ignored, which
# need a GGUF file and a pinned llama.cpp build, are not part of this job.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
